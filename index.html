<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>

:root[data-theme="dark"]{--bg:#101815;--card:#18231E;--ink:#E7EEEA;--mut:#9DB0A6;--line:#2B3B33;--g:#6CC08C;--gl:#4C9A6A;--gs:#1E3329;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Schibsted Grotesk",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:#1F4D3A;color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}

nav button:hover,nav button.on{background:#2D6A50;color:#fff}nav button:focus-visible{outline:2px solid #fff}
main{flex:1;min-width:0;padding:22px 24px 60px}

.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.k b{display:block;font-size:26px;color:var(--g)}.k span{font-size:12px;color:var(--mut)}

.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
.row{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px;cursor:pointer;background:none;border:0;width:100%;text-align:left;color:var(--ink);padding:2px}
.row i{display:block;height:14px;background:var(--gl);border-radius:3px}.row.on i{background:var(--g)}.row em{font-style:normal;color:var(--mut);text-align:right}
.cols{display:flex;gap:6px;align-items:end;height:150px}.col{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:end;align-items:center;font-size:11px;cursor:pointer;background:none;border:0;color:var(--ink);height:100%}
.col i{display:block;width:70%;background:var(--gl);border-radius:3px 3px 0 0}.col:hover i{background:var(--g)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.f .w{grid-column:1/-1}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--gs);color:var(--g)}.tag.y{background:#F6E7BD;color:#7A5A00}
.mut{color:var(--mut);font-size:13px}.empty{padding:22px;text-align:center;color:var(--mut)}.msg{margin:10px 0;padding:10px;border-radius:8px;background:var(--gs)}.err{background:#F6D9D4;color:#8A2A1D}

:root{--g:#1D5FBF;--gl:#5B93DB;--gs:#E4EEFB;--bg:#F2F5F9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#7FB0F5;--gl:#4C86D9;--gs:#1B2C45}}
:root[data-theme="dark"]{--g:#7FB0F5;--gl:#4C86D9;--gs:#1B2C45}
nav{width:250px;background:#0B2A4A;overflow-y:auto;gap:2px}

.nb{display:flex;flex-direction:column;gap:2px}.gl{font-size:11px;opacity:.6;margin:10px 8px 2px}
.fl{margin-top:14px;border-top:1px solid #ffffff33;padding-top:10px;font-size:13px;color:#DCE8F5}.fl summary{cursor:pointer;font-weight:600;margin-bottom:4px}
.fl h4{margin:10px 0 4px;font-size:12px;font-weight:600}.fl label{color:#DCE8F5;font-size:12px;flex-direction:row;align-items:center;gap:6px}
.fl .bx{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.fl input[type=month],.fl select{width:100%;font-size:12px;padding:5px;background:#fff;color:#1B2A24}
.hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .b{padding:6px 12px;font-size:13px}
.k span:first-child{font-size:13px;color:var(--mut)}.k b{margin:2px 0}.k select,.k input{margin:4px 0}
@media(max-width:760px){nav{width:100%;height:auto;position:static;flex-direction:column;overflow:visible}nav h1,nav small{display:block}.nb{flex-direction:row;flex-wrap:wrap}}
.gr{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}.kp{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.k b{font-size:20px;overflow-wrap:anywhere}
@media(max-width:760px){.gr{grid-template-columns:1fr}}
.c td,.c th{padding:6px 7px;font-size:12.5px}
.row.sel{outline:2px solid var(--g);border-radius:4px;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}.chip{background:var(--gs);color:var(--g);border:1px solid var(--g);border-radius:99px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
</style>
</head>

<script>
var KEY="sirea_v1",P=["Visão Executiva","Cadastro de Anomalias","Investigação Guiada","Rastreabilidade","Plano de Ação","Controles Preventivos","Indicadores e Estabilidade","Previsão","Base Histórica","Mapa de Processos","Relatórios","Administração"],IC=["▦","✎","?","⇄","☑","⚑","∿","⌒","⇪","◈","▤","⚙"];

var GC=["Planejamento inadequado","Padronização insuficiente","Controle / Monitoramento insuficiente","Falha de execução / aderência","Pessoas / Capacidade operacional","Comunicação / Integração","Equipamento / Infraestrutura","Material / Fornecedor","Controle sanitário"];
var ET=["Em investigação","Planejamento de demanda e cardápio","Compras e abastecimento","Recebimento de insumos","Armazenamento","Pré-preparo","Produção e cocção","Transporte","Distribuição","Pós-distribuição"];
var db={rest:["Juçara","ROF","RVV"],tipos:["Parada de Rampa","Corpo Estranho","Microbiologia","Produto Vencido","Temperatura","Equipamento"],an:[],op:[]};
try{var s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}

function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function opts(a,v,all){return(all?'<option value="">'+all+'</option>':'')+a.map(function(x){return'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join("")}
function mo(d){return d.slice(0,7)}
function inR(m){return(!f.from||m>=f.from)&&(!f.to||m<=f.to)}
function A(){return db.an.filter(function(a){return(!f.rest||a.rest===f.rest)&&(!f.tipo||a.tipo===f.tipo)&&inR(mo(a.data))})}
function O(){return db.op.filter(function(o){return(!f.rest||o.rest===f.rest)&&inR(o.mes)})}
function sum(a,k){return a.reduce(function(s,x){return s+(+x[k]||0)},0)}
function cnt(a,k){var r={};a.forEach(function(x){var v=x[k]||"(não informado)";r[v]=(r[v]||0)+1});return Object.keys(r).map(function(n){return[n,r[n]]}).sort(function(a,b){return b[1]-a[1]})}
function fmt(n,d){return n.toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function nav(){document.getElementById("nav").innerHTML='<h1>SIREA</h1><small>Rastreabilidade e Estabilização de Anomalias</small>'+[0,1,2,3,9,4,5,6,7,8,10,11].map(function(i){var p=P[i];return'<button class="'+(i===pg?"on":"")+'" onclick="go('+i+')"><span aria-hidden="true">'+IC[i]+'</span>'+p+'</button>'}).join("")}
function go(i){pg=i;note="";edId="";draw()}
function filt(){var ms={};db.an.forEach(function(a){ms[mo(a.data)]=1});db.op.forEach(function(o){ms[o.mes]=1});var L=Object.keys(ms).sort();
return'<div class="bar"><label>Restaurante<select onchange="f.rest=this.value;draw()">'+opts(db.rest,f.rest,"Todos")+'</select></label><label>Tipo de anomalia<select onchange="f.tipo=this.value;draw()">'+opts(db.tipos,f.tipo,"Todos")+'</select></label><label>De<input type="month" value="'+f.from+'" onchange="f.from=this.value;draw()"></label><label>Até<input type="month" value="'+f.to+'" onchange="f.to=this.value;draw()"></label><button class="b s" onclick="f={rest:\'\',tipo:\'\',from:\'\',to:\'\'};draw()">Limpar filtros</button></div>'}
function bars(list,key,den){var mx=Math.max.apply(null,list.map(function(x){return x[1]}).concat([1]));
return list.map(function(x){return'<button class="row'+(f[key]===x[0]?' on':'')+'" onclick="f.'+key+'=f.'+key+'===\''+x[0].replace(/'/g,"\\'")+'\'?\'\':\''+x[0].replace(/'/g,"\\'")+'\';draw()"><span>'+esc(x[0])+'</span><i style="width:'+(x[1]/mx*100)+'%"></i><em>'+x[1]+(den?den(x[0]):"")+'</em></button>'}).join("")}
function dash(){var a=A(),o=O(),tot=a.length,ref=sum(o,"refeicoes"),tc=a.filter(cov).length,tx=ref>0?tc/ref*RB():null;

if(!db.an.length&&!db.op.length)return h+'<div class="c empty">Nenhum dado ainda. Importe sua planilha ou veja o app com dados de exemplo.<br><br><button class="b" onclick="go(8)">Importar planilha</button> <button class="b s" onclick="demo();go(0)">Ver com dados DEMO</button></div>';
var ms={};a.forEach(function(x){ms[mo(x.data)]=(ms[mo(x.data)]||0)+1});o.forEach(function(x){if(!ms[x.mes])ms[x.mes]=0});var ML=Object.keys(ms).sort(),mx=Math.max.apply(null,ML.map(function(m){return ms[m]}).concat([1]));

var tp=cnt(a,"tipo");
h+='<div class="c"><h3>Pareto por tipo de anomalia</h3>'+(tp.length?bars(tp,"tipo",function(n){return" ("+fmt(a.filter(function(x){return x.tipo===n}).length/tot*100)+"%)"}):'<div class="empty">Sem ocorrências.</div>')+'</div>';
h+='<div class="c"><h3>Anomalias por restaurante</h3>'+(rs.length?bars(rs,"rest",function(n){var v=sum(db.op.filter(function(x){return x.rest===n&&inR(x.mes)}),"refeicoes");return v>0?" · "+fmt(a.filter(function(x){return x.rest===n&&cov(x)}).length/v*RB(),2)+"/10 mil":" · sem volume"}):'<div class="empty">Sem ocorrências.</div>')+'<p class="mut">A taxa por restaurante só aparece quando há refeições informadas para ele.</p></div>';
h+='<div class="c"><h3>Grupo da causa raiz</h3>'+(a.length?bars(cnt(a,"grupoCausa")):'<div class="empty">Sem ocorrências.</div>')+'</div></div>';
h+='<div class="c"><h3>Ocorrências ('+tot+(tot>200?', mostrando as 200 mais recentes':'')+')</h3>'+(tot?'<table><tr><th>ID</th><th>Data</th><th>Restaurante</th><th>Tipo</th><th>Etapa de origem</th><th>Causa raiz</th><th>Status</th><th></th></tr>'+a.sort(function(x,y){return y.data.localeCompare(x.data)}).slice(0,200).map(function(x){return'<tr><td>'+esc(x.id)+(x.demo?' <span class="tag y">DEMO</span>':'')+'</td><td>'+x.data.split("-").reverse().join("/")+'</td><td>'+esc(x.rest)+'</td><td>'+esc(x.tipo)+'</td><td>'+esc(x.etapa||"—")+'</td><td>'+esc(x.causa||"—")+'</td><td><span class="tag'+(x.status==="Confirmada"?"":" y")+'">'+esc(x.status)+'</span></td><td><button class="b s" onclick="edA(\''+x.id+'\')">Editar</button> <button class="b s" onclick="del(\''+x.id+'\')">Excluir</button></td></tr>'}).join("")+'</table>':'<div class="empty">Nenhuma ocorrência para os filtros atuais.</div>')+'</div>';
return h}
function del(id){db.an=db.an.filter(function(x){return x.id!==id});save();draw()}
function nid(){var y=new Date().getFullYear(),n=db.an.filter(function(x){return x.id.indexOf("AN-"+y)===0}).length+1,id;do{id="AN-"+y+"-"+String(n++).padStart(4,"0")}while(db.an.some(function(x){return x.id===id}));return id}
function form(){var t=new Date().toISOString().slice(0,10);
return'<h2>Cadastro de Anomalias</h2>'+(note?'<div class="msg'+(note.charAt(0)==="!"?" err":"")+'">'+esc(note.replace(/^!/,""))+'</div>':'')+'<form id="fa" class="c" onsubmit="return false"><div class="f"><label>Data<input type="date" name="data" value="'+t+'" required></label><label>Restaurante<select name="rest">'+opts(db.rest)+'</select></label><label>Unidade operacional<input name="unidade"></label><label>Turno / refeição<select name="turno">'+opts(["Café","Almoço","Jantar","Ceia"])+'</select></label><label>Tipo de anomalia<select name="tipo">'+opts(db.tipos)+'</select></label><label>Preparação ou produto<input name="produto"></label><label class="w">Descrição objetiva<textarea name="desc" required></textarea></label><label>Grupo do problema<select name="grupoProb">'+opts(GP)+'</select></label><label>Etapa de origem<select name="etapa">'+opts(ET)+'</select></label><label>Etapa de detecção<select name="detec">'+opts(ET.slice(1))+'</select></label><label>Subprocesso<input name="sub" list="dl_s"></label><label>Ponto de causa<input name="ponto" list="dl_p"></label>'+dls()+'<label class="w">Causa raiz (simples, objetiva e verificável)<textarea name="causa"></textarea></label><label>Grupo da causa raiz<select name="grupoCausa" onchange="sug4M(this)">'+opts(GC,"","Não definido")+'</select></label><label>Classificação 4M<select name="m4">'+opts(["Método","Mão de Obra","Máquina","Material"],"","Não definido")+'</select></label><label class="w">Evidência que sustenta a causa<textarea name="evid"></textarea></label><label class="w">Problema específico<input name="problemaEsp"></label><label class="w">5 Porquês (um por linha, só até onde houver evidência)<textarea name="porques"></textarea></label><label class="w">Controle preventivo ausente ou falho<input name="ctrlFalho"></label><label class="w">Ação estrutural recomendada<textarea name="acaoEst"></textarea></label><label>Indicador leading<input name="indLead"></label><label>Indicador lagging<input name="indLag"></label><label>ID da anomalia (vazio = automático)<input name="idNovo"></label><label>Hora<input type="time" name="hora"></label><label>Severidade<select name="sev">'+opts(['Alta','Média','Baixa','Muito baixa'],'','Não informada')+'</select></label><label>Status da ocorrência<select name="stOc">'+opts(['Aberta','Em análise','Ação em andamento','Concluída'])+'</select></label><label>Tempo de resposta (min)<input type="number" min="0" name="tResp"></label><label>Tempo de resolução (min)<input type="number" min="0" name="tRes"></label><label>Refeições impactadas<input type="number" min="0" name="refImp"></label><label>Duração da ocorrência (min)<input type="number" min="0" name="dur"></label><label>Reclamações registradas<input type="number" min="0" name="recl"></label><label class="w">Lição aprendida<textarea name="licao"></textarea></label><label>Status de validação<select name="status">'+opts(["Em investigação","Confirmada"])+'</select></label><label>Responsável pelo registro<input name="resp"></label></div><p class="mut">Para marcar como Confirmada, informe a causa raiz e a evidência. Sem isso, a causa fica Em investigação.</p><button class="b" onclick="addA()">Salvar anomalia</button></form>'}
function addA(){var F=document.getElementById("fa"),v={};Array.prototype.forEach.call(F.elements,function(e){if(e.name)v[e.name]=e.value.trim()});
if(!v.data||!v.desc){note="!Informe a data e a descrição da ocorrência.";return draw()}
if(v.status==="Confirmada"&&(!v.causa||!v.evid)){note="!Para validar, preencha causa raiz e evidência.";return draw()}lastMiss=reqMiss(v);if(lastMiss.length&&par().bloq){note='!Preencha os campos obrigatórios: '+lastMiss.join(', ')+'.';return draw()}
var old0=edId?db.an.filter(function(x){return x.id===edId})[0]:null;var wantId=(v.idNovo||'').trim(),newId=edId||nid();if(wantId&&wantId!==edId){if(db.an.some(function(x){return x.id===wantId})){note='!Já existe uma anomalia com o ID '+wantId+'.';return draw()}newId=wantId;if(edId)renRefs(edId,wantId)}if(edId)db.an=db.an.filter(function(x){return x.id!==edId});db.an.push(Object.assign({},old0||{},{id:newId,data:v.data,corr:corrOf(v.rest),site:siteOf(v.rest),rest:v.rest,unidade:v.unidade,turno:v.turno,tipo:v.tipo,produto:v.produto,desc:v.desc,grupoProb:v.grupoProb,etapa:v.etapa,detec:v.detec,sub:v.sub,ponto:v.ponto,causa:v.causa,grupoCausa:v.grupoCausa,m4:v.m4,evid:v.evid,status:v.status,resp:v.resp,hora:v.hora,sev:v.sev,stOc:v.stOc,tResp:v.tResp,tRes:v.tRes,refImp:v.refImp,licao:v.licao,problemaEsp:v.problemaEsp,porques:v.porques,ctrlFalho:v.ctrlFalho,acaoEst:v.acaoEst,indLead:v.indLead,indLag:v.indLag,dur:v.dur,recl:v.recl,ofensor:v.ofensor,mbi:v.mbi,protClass:v.protClass,fotos:fotosForSave(old0)}));save();note=(edId?"Alterações salvas em "+edId+".":"Anomalia salva. Ela já aparece na Visão Geral.")+(lastMiss.length?" Atenção, faltam: "+lastMiss.join(", ")+".":"");edId="";draw()}

function invest(){var d=iv.d,L=ivSteps(),i=L.indexOf(iv.step);if(i<0){iv.step=1;i=0}var st=iv.step,h='<h2>Investigação Guiada</h2>'+nt()+'<div class="c" style="margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b>Modo:</b><button class="b'+(iv.mode==='rapido'?'':' s')+'" onclick="iv.mode=\'rapido\';iv.step=1;draw()">Rápido (3 passos)</button><button class="b'+(iv.mode==='completo'?'':' s')+'" onclick="iv.mode=\'completo\';draw()">Completo (6 passos)</button>'+(edId?'<span class="mut">Atualizando '+esc(edId)+'</span> <button class="b s" onclick="ivNew()">Nova investigação</button>':'')+'</div><div style="display:flex;gap:4px;margin-top:10px;flex-wrap:wrap">'+L.map(function(n,k){var on=n===st,dn=k<i;return'<button class="b'+(on?'':' s')+'" style="'+(dn?'border-color:#2E9E6B;':'')+'" onclick="ivGo('+n+')">'+(dn?'✓ ':'')+n+'. '+IVN[n-1]+'</button>'}).join('')+'</div><div style="height:6px;border-radius:3px;background:var(--line);margin-top:10px"><div style="height:6px;border-radius:3px;background:#1D5FBF;width:'+Math.round((i+1)/L.length*100)+'%"></div></div><p class="mut" style="margin:6px 0 0">Qualidade do registro agora: <b>'+ivScore()+'%</b></p></div><div class="c"><h3>Passo '+(i+1)+' de '+L.length+' — '+IVN[st-1]+'</h3>';

else if(st===4){h+='<div class="f">'+ta('causa','Causa raiz (simples, objetiva e verificável)','causa')+ta('evid','Evidência que sustenta a causa','evid')+sel('grupoCausa','Grupo da causa raiz',GC)+sel('m4','Classificação 4M',['Método','Mão de Obra','Máquina','Material'])+'</div>'+ivSug('grupoCausa',tmp)+ivSug('m4',tmp)+'<h4 style="margin:12px 0 4px">Perguntas que ajudam a classificar</h4><p class="mut">'+IVH.gc+'</p>'+Q.slice(0,6).map(function(q,k){return'<p style="margin:4px 0">'+esc(q[0])+' <button class="b'+(iv.ans&&iv.ans[k]==='S'?'':' s')+'" onclick="ivQ('+k+',\'S\')">Sim</button> <button class="b'+(iv.ans&&iv.ans[k]==='N'?'':' s')+'" onclick="ivQ('+k+',\'N\')">Não</button></p>'}).join('')}

F.forEach(function(k){if(d[k]!==undefined&&d[k]!==''&&d[k]!=='Em investigação')rec[k]=d[k]});rec.man17=rec.man17||{};['etapa','detec','grupoCausa','m4','sub','ponto'].forEach(function(k){if(d[k])rec.man17[k]=1});

/* ===== v17 (C7): sugestões baseadas nos dados (metas e cadastro), sempre com a evidência ===== */
function pct17(a,q){var s=a.slice().sort(function(x,y){return x-y}),i=(s.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function metaSug17(){var rows=[],mk=function(nome,s,key){var u=s.filter(function(x){return x.n>0}).map(function(x){return x.c/x.n*RB()});if(u.length<6)return;var m=u.reduce(function(a,b){return a+b},0)/u.length;if(!(m>0))return;var sd=Math.sqrt(u.reduce(function(a,b){return a+Math.pow(b-m,2)},0)/(u.length-1)),p25=pct17(u,.25),sug=p25>0?p25:Math.max(m*.5,m-sd);rows.push({k:key,nome:nome,m:m,sd:sd,p25:p25,sug:Math.round(sug*100)/100,n:u.length,ini:s[0].m,fim:s[s.length-1].m})};
mk('Todas as anomalias (rede)',fser('*',''),'*');db.tipos.forEach(function(t){mk(t,fser('*',t),t)});return rows}
function metaApply17(k,v){v=parseFloat(String(v).replace(',','.'));if(isNaN(v))return;if(k==='*'){db.cfg=db.cfg||{};db.cfg.metaTaxa=v;db.cfg.metaOrig='dados'}else{var P0=par();P0.tipos[k]=P0.tipos[k]||{};P0.tipos[k].meta=v;P0.tipos[k].metaOrig='dados'}save();note='Meta aplicada: '+(k==='*'?'rede':k)+' = '+fmt(v,2)+' por '+RBL()+' refeições (sugerida pelos seus dados). Você pode editá-la nos campos acima.';draw()}
function metaAll17(){var n=0;metaSug17().forEach(function(r){var cur=r.k==='*'?(db.cfg&&db.cfg.metaTaxa):par().tipos[r.k]&&par().tipos[r.k].meta;if(cur===undefined||cur===''||cur==null){if(r.k==='*'){db.cfg=db.cfg||{};db.cfg.metaTaxa=r.sug;db.cfg.metaOrig='dados'}else{var P0=par();P0.tipos[r.k]=P0.tipos[r.k]||{};P0.tipos[r.k].meta=r.sug;P0.tipos[r.k].metaOrig='dados'}n++}});save();note=n+' meta(s) sem valor foram preenchidas com a sugestão dos dados. As que você já tinha definido não foram alteradas.';draw()}
var _par17=parPage;parPage=function(){var h=_par17(),R=metaSug17();if(!R.length)return h;return h+'<div class="c" style="margin-top:14px"><h3>Metas sugeridas pelos seus dados</h3><p class="mut">Calculadas só com os meses que têm refeições informadas. A sugestão é o nível que um quarto dos meses já atingiu (percentil 25). Nada é aplicado sem o seu clique.</p><div style="overflow-x:auto"><table><tr><th>Indicador</th><th>Meses</th><th>Média</th><th>Desvio</th><th>P25</th><th>Meta sugerida</th><th>Meta atual</th><th></th></tr>'+R.map(function(r){var cur=r.k==='*'?(db.cfg&&db.cfg.metaTaxa):par().tipos[r.k]&&par().tipos[r.k].meta,has=cur!==undefined&&cur!==''&&cur!=null;return'<tr><td>'+esc(r.nome)+'</td><td>'+r.n+'<br><span class="mut">'+mlab(r.ini)+' a '+mlab(r.fim)+'</span></td><td>'+fmt(r.m,2)+'</td><td>'+fmt(r.sd,2)+'</td><td>'+fmt(r.p25,2)+'</td><td><b>'+fmt(r.sug,2)+'</b></td><td>'+(has?fmt(+cur,2):'—')+'</td><td><button class="b s" data-k="'+esc(r.k)+'" data-v="'+r.sug+'" onclick="metaApply17(this.dataset.k,this.dataset.v)">'+(has?'Substituir':'Aplicar')+'</button></td></tr>'}).join('')+'</table></div><p><button class="b" onclick="metaAll17()">Preencher só as metas vazias</button></p><p class="mut">Taxas por '+RBL()+' refeições. Com poucos meses a sugestão é instável.</p></div>'};
function cadSug17(){var R=[];restAll().forEach(function(r){var inf=rInfo(r),an=db.an.filter(function(a){return a.rest===r}),mode=function(k){var c={};an.forEach(function(a){if(a[k])c[a[k]]=(c[a[k]]||0)+1});var ks=Object.keys(c).sort(function(a,b){return c[b]-c[a]});return ks.length?{v:ks[0],n:c[ks[0]],t:an.length}:null};var s=!inf.site?mode('site'):null,c2=!inf.corr?mode('corr'):null;if(s||c2)R.push({r:r,s:s,c:c2})});return R}
function cadApply17(r){var x=cadSug17().filter(function(y){return y.r===r})[0];if(!x)return;rmapSet(r,x.c?x.c.v:'',x.s?x.s.v:'');save();note='Cadastro de '+r+' atualizado com o que as ocorrências informam.';draw()}

var _cp17=centralPg;centralPg=function(){var h=_cp17(),R=cadSug17();if(!R.length)return h;return h+'<div class="c" style="margin-top:14px"><h3>Sugestões de cadastro a partir dos dados</h3><p class="mut">Restaurantes sem site ou corredor, onde as próprias ocorrências já informam. Mostra em quantas ocorrências a sugestão se baseia.</p><table><tr><th>Restaurante</th><th>Site sugerido</th><th>Corredor sugerido</th><th></th></tr>'+R.slice(0,40).map(function(x){return'<tr><td>'+esc(x.r)+'</td><td>'+(x.s?esc(x.s.v)+' <span class="mut">('+x.s.n+' de '+x.s.t+' ocorrências)</span>':'—')+'</td><td>'+(x.c?esc(x.c.v)+' <span class="mut">('+x.c.n+' de '+x.c.t+')</span>':'—')+'</td><td><button class="b s" data-r="'+esc(x.r)+'" onclick="cadApply17(this.dataset.r)">Aplicar</button></td></tr>'}).join('')+'</table><p><button class="b" onclick="cadAll17()">Aplicar todas</button></p></div>'};
