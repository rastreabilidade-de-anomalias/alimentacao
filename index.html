<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIREA — Rastreabilidade de Anomalias</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F6F4;--card:#fff;--ink:#1B2A24;--mut:#5E6F67;--line:#DDE5E0;--g:#1F4D3A;--gl:#4C9A6A;--y:#D9A21B;--r:#C2402E;--gs:#E6F1EA;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--card:#18231E;--ink:#E7EEEA;--mut:#9DB0A6;--line:#2B3B33;--g:#6CC08C;--gl:#4C9A6A;--gs:#1E3329;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101815;--card:#18231E;--ink:#E7EEEA;--mut:#9DB0A6;--line:#2B3B33;--g:#6CC08C;--gl:#4C9A6A;--gs:#1E3329;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Schibsted Grotesk",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:#1F4D3A;color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:20px;margin:0 8px 2px;letter-spacing:.5px}nav small{display:block;margin:0 8px 18px;opacity:.75;font-size:12px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;color:#DCEBE2}
nav button:hover,nav button.on{background:#2D6A50;color:#fff}nav button:focus-visible{outline:2px solid #fff}
main{flex:1;min-width:0;padding:22px 24px 60px}
h2{font-size:22px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:10px;margin-bottom:16px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select,textarea,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
button.b{cursor:pointer;background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
:root[data-theme="dark"] button.b,:root:not([data-theme="light"]) button.b{color:#0F1D17}
button.s{background:var(--card);color:var(--ink);border-color:var(--line)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.k b{display:block;font-size:26px;color:var(--g)}.k span{font-size:12px;color:var(--mut)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
.row{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px;cursor:pointer;background:none;border:0;width:100%;text-align:left;color:var(--ink);padding:2px}
.row i{display:block;height:14px;background:var(--gl);border-radius:3px}.row.on i{background:var(--g)}.row em{font-style:normal;color:var(--mut);text-align:right}
.cols{display:flex;gap:6px;align-items:end;height:150px}.col{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:end;align-items:center;font-size:11px;cursor:pointer;background:none;border:0;color:var(--ink);height:100%}
.col i{display:block;width:70%;background:var(--gl);border-radius:3px 3px 0 0}.col:hover i{background:var(--g)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.f .w{grid-column:1/-1}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--gs);color:var(--g)}.tag.y{background:#F6E7BD;color:#7A5A00}
.mut{color:var(--mut);font-size:13px}.empty{padding:22px;text-align:center;color:var(--mut)}.msg{margin:10px 0;padding:10px;border-radius:8px;background:var(--gs)}.err{background:#F6D9D4;color:#8A2A1D}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:sticky;flex-direction:row;overflow-x:auto;padding:8px;z-index:5}nav h1,nav small{display:none}nav button{white-space:nowrap}main{padding:14px 12px 60px}}
@media print{nav,.bar,button,textarea{display:none!important}body{display:block}main{padding:0}}

:root{--g:#1D5FBF;--gl:#5B93DB;--gs:#E4EEFB;--bg:#F2F5F9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#7FB0F5;--gl:#4C86D9;--gs:#1B2C45}}
:root[data-theme="dark"]{--g:#7FB0F5;--gl:#4C86D9;--gs:#1B2C45}
nav{width:250px;background:#0B2A4A;overflow-y:auto;gap:2px}
nav button:hover,nav button.on{background:#17457A}
.nb{display:flex;flex-direction:column;gap:2px}.gl{font-size:11px;opacity:.6;margin:10px 8px 2px}
.fl{margin-top:14px;border-top:1px solid #ffffff33;padding-top:10px;font-size:13px;color:#DCE8F5}.fl summary{cursor:pointer;font-weight:600;margin-bottom:4px}
.fl h4{margin:10px 0 4px;font-size:12px;font-weight:600}.fl label{color:#DCE8F5;font-size:12px;flex-direction:row;align-items:center;gap:6px}
.fl .bx{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.fl input[type=month],.fl select{width:100%;font-size:12px;padding:5px;background:#fff;color:#1B2A24}
.hd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .b{padding:6px 12px;font-size:13px}
.k span:first-child{font-size:13px;color:var(--mut)}.k b{margin:2px 0}.k select,.k input{margin:4px 0}
@media(max-width:760px){nav{width:100%;height:auto;position:static;flex-direction:column;overflow:visible}nav h1,nav small{display:block}.nb{flex-direction:row;flex-wrap:wrap}}
.gr{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}.kp{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.k b{font-size:20px;overflow-wrap:anywhere}
@media(max-width:760px){.gr{grid-template-columns:1fr}}
.c td,.c th{padding:6px 7px;font-size:12.5px}
.row.sel{outline:2px solid var(--g);border-radius:4px;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}.chip{background:var(--gs);color:var(--g);border:1px solid var(--g);border-radius:99px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="m"></main>
<script>
var KEY="sirea_v1",P=["Visão Executiva","Cadastro de Anomalias","Investigação Guiada","Rastreabilidade","Plano de Ação","Controles Preventivos","Indicadores e Estabilidade","Previsão","Base Histórica","Mapa de Processos","Relatórios","Administração"],IC=["▦","✎","?","⇄","☑","⚑","∿","⌒","⇪","◈","▤","⚙"];
var GP=["Planejamento / Dimensionamento","Demanda / Consumo","Produção / Disponibilidade","Reposição / Abastecimento","Estoque / Insumos","Porcionamento / Rendimento","Qualidade / Segurança dos Alimentos","Contaminação / Corpo Estranho","Equipamento / Infraestrutura","Fluxo Operacional / Atendimento"];
var GC=["Planejamento inadequado","Padronização insuficiente","Controle / Monitoramento insuficiente","Falha de execução / aderência","Pessoas / Capacidade operacional","Comunicação / Integração","Equipamento / Infraestrutura","Material / Fornecedor","Controle sanitário"];
var ET=["Em investigação","Planejamento de demanda e cardápio","Compras e abastecimento","Recebimento de insumos","Armazenamento","Pré-preparo","Produção e cocção","Transporte","Distribuição","Pós-distribuição"];
var db={rest:["Juçara","ROF","RVV"],tipos:["Parada de Rampa","Corpo Estranho","Microbiologia","Produto Vencido","Temperatura","Equipamento"],an:[],op:[]};
try{var s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
var f={rest:"",tipo:"",from:"",to:""},pg=0,note="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function opts(a,v,all){return(all?'<option value="">'+all+'</option>':'')+a.map(function(x){return'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join("")}
function mo(d){return d.slice(0,7)}
function inR(m){return(!f.from||m>=f.from)&&(!f.to||m<=f.to)}
function A(){return db.an.filter(function(a){return(!f.rest||a.rest===f.rest)&&(!f.tipo||a.tipo===f.tipo)&&inR(mo(a.data))})}
function O(){return db.op.filter(function(o){return(!f.rest||o.rest===f.rest)&&inR(o.mes)})}
function sum(a,k){return a.reduce(function(s,x){return s+(+x[k]||0)},0)}
function cnt(a,k){var r={};a.forEach(function(x){var v=x[k]||"(não informado)";r[v]=(r[v]||0)+1});return Object.keys(r).map(function(n){return[n,r[n]]}).sort(function(a,b){return b[1]-a[1]})}
function fmt(n,d){return n.toLocaleString("pt-BR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function nav(){document.getElementById("nav").innerHTML='<h1>SIREA</h1><small>Rastreabilidade e Estabilização de Anomalias</small>'+[0,1,2,3,9,4,5,6,7,8,10,11].map(function(i){var p=P[i];return'<button class="'+(i===pg?"on":"")+'" onclick="go('+i+')"><span aria-hidden="true">'+IC[i]+'</span>'+p+'</button>'}).join("")}
function go(i){pg=i;note="";edId="";draw()}
function filt(){var ms={};db.an.forEach(function(a){ms[mo(a.data)]=1});db.op.forEach(function(o){ms[o.mes]=1});var L=Object.keys(ms).sort();
return'<div class="bar"><label>Restaurante<select onchange="f.rest=this.value;draw()">'+opts(db.rest,f.rest,"Todos")+'</select></label><label>Tipo de anomalia<select onchange="f.tipo=this.value;draw()">'+opts(db.tipos,f.tipo,"Todos")+'</select></label><label>De<input type="month" value="'+f.from+'" onchange="f.from=this.value;draw()"></label><label>Até<input type="month" value="'+f.to+'" onchange="f.to=this.value;draw()"></label><button class="b s" onclick="f={rest:\'\',tipo:\'\',from:\'\',to:\'\'};draw()">Limpar filtros</button></div>'}
function bars(list,key,den){var mx=Math.max.apply(null,list.map(function(x){return x[1]}).concat([1]));
return list.map(function(x){return'<button class="row'+(f[key]===x[0]?' on':'')+'" onclick="f.'+key+'=f.'+key+'===\''+x[0].replace(/'/g,"\\'")+'\'?\'\':\''+x[0].replace(/'/g,"\\'")+'\';draw()"><span>'+esc(x[0])+'</span><i style="width:'+(x[1]/mx*100)+'%"></i><em>'+x[1]+(den?den(x[0]):"")+'</em></button>'}).join("")}
function dash(){var a=A(),o=O(),tot=a.length,ref=sum(o,"refeicoes"),tc=a.filter(cov).length,tx=ref>0?tc/ref*10000:null;
var val=a.filter(function(x){return x.status==="Validada"}).length,rs=cnt(a,"rest");
var h=filt()+'<div class="kp"><div class="k"><b>'+tot+'</b><span>Total de anomalias</span></div><div class="k"><b>'+(ref>0?fmt(ref):"—")+'</b><span>Refeições servidas</span></div><div class="k"><b>'+(tx==null?"—":fmt(tx,3))+'</b><span>Anomalias por 10 mil refeições'+(tc<tot?' (só as '+tc+' de '+tot+' com refeições informadas)':'')+'</span></div><div class="k"><b>'+rs.length+'</b><span>Restaurantes com ocorrências</span></div><div class="k"><b>'+(tot?fmt(val/tot*100)+"%":"—")+'</b><span>Com causa validada</span></div></div>';
if(!db.an.length&&!db.op.length)return h+'<div class="c empty">Nenhum dado ainda. Importe sua planilha ou veja o app com dados de exemplo.<br><br><button class="b" onclick="go(8)">Importar planilha</button> <button class="b s" onclick="demo();go(0)">Ver com dados DEMO</button></div>';
var ms={};a.forEach(function(x){ms[mo(x.data)]=(ms[mo(x.data)]||0)+1});o.forEach(function(x){if(!ms[x.mes])ms[x.mes]=0});var ML=Object.keys(ms).sort(),mx=Math.max.apply(null,ML.map(function(m){return ms[m]}).concat([1]));
h+='<div class="gr"><div class="c"><h3>Evolução mensal</h3>'+(ML.length?'<div class="cols">'+ML.map(function(m){return'<button class="col" onclick="f.from=f.to=\''+m+'\';draw()"><span>'+ms[m]+'</span><i style="height:'+(ms[m]/mx*110+2)+'px"></i><span>'+m.slice(5)+"/"+m.slice(2,4)+'</span></button>'}).join("")+'</div>':'<div class="empty">Sem dados no período.</div>')+'<p class="mut">Clique em uma barra para filtrar o mês.</p></div>';
var tp=cnt(a,"tipo");
h+='<div class="c"><h3>Pareto por tipo de anomalia</h3>'+(tp.length?bars(tp,"tipo",function(n){return" ("+fmt(a.filter(function(x){return x.tipo===n}).length/tot*100)+"%)"}):'<div class="empty">Sem ocorrências.</div>')+'</div>';
h+='<div class="c"><h3>Anomalias por restaurante</h3>'+(rs.length?bars(rs,"rest",function(n){var v=sum(db.op.filter(function(x){return x.rest===n&&inR(x.mes)}),"refeicoes");return v>0?" · "+fmt(a.filter(function(x){return x.rest===n&&cov(x)}).length/v*10000,2)+"/10 mil":" · sem volume"}):'<div class="empty">Sem ocorrências.</div>')+'<p class="mut">A taxa por restaurante só aparece quando há refeições informadas para ele.</p></div>';
h+='<div class="c"><h3>Grupo da causa raiz</h3>'+(a.length?bars(cnt(a,"grupoCausa")):'<div class="empty">Sem ocorrências.</div>')+'</div></div>';
h+='<div class="c"><h3>Ocorrências ('+tot+(tot>200?', mostrando as 200 mais recentes':'')+')</h3>'+(tot?'<table><tr><th>ID</th><th>Data</th><th>Restaurante</th><th>Tipo</th><th>Etapa de origem</th><th>Causa raiz</th><th>Status</th><th></th></tr>'+a.sort(function(x,y){return y.data.localeCompare(x.data)}).slice(0,200).map(function(x){return'<tr><td>'+esc(x.id)+(x.demo?' <span class="tag y">DEMO</span>':'')+'</td><td>'+x.data.split("-").reverse().join("/")+'</td><td>'+esc(x.rest)+'</td><td>'+esc(x.tipo)+'</td><td>'+esc(x.etapa||"—")+'</td><td>'+esc(x.causa||"—")+'</td><td><span class="tag'+(x.status==="Validada"?"":" y")+'">'+esc(x.status)+'</span></td><td><button class="b s" onclick="edA(\''+x.id+'\')">Editar</button> <button class="b s" onclick="del(\''+x.id+'\')">Excluir</button></td></tr>'}).join("")+'</table>':'<div class="empty">Nenhuma ocorrência para os filtros atuais.</div>')+'</div>';
return h}
function del(id){db.an=db.an.filter(function(x){return x.id!==id});save();draw()}
function nid(){var y=new Date().getFullYear(),n=db.an.filter(function(x){return x.id.indexOf("AN-"+y)===0}).length+1,id;do{id="AN-"+y+"-"+String(n++).padStart(4,"0")}while(db.an.some(function(x){return x.id===id}));return id}
function form(){var t=new Date().toISOString().slice(0,10);
return'<h2>Cadastro de Anomalias</h2>'+(note?'<div class="msg'+(note.charAt(0)==="!"?" err":"")+'">'+esc(note.replace(/^!/,""))+'</div>':'')+'<form id="fa" class="c" onsubmit="return false"><div class="f"><label>Data<input type="date" name="data" value="'+t+'" required></label><label>Restaurante<select name="rest">'+opts(db.rest)+'</select></label><label>Unidade operacional<input name="unidade"></label><label>Turno / refeição<select name="turno">'+opts(["Café","Almoço","Jantar","Ceia"])+'</select></label><label>Tipo de anomalia<select name="tipo">'+opts(db.tipos)+'</select></label><label>Preparação ou produto<input name="produto"></label><label class="w">Descrição objetiva<textarea name="desc" required></textarea></label><label>Grupo do problema<select name="grupoProb">'+opts(GP)+'</select></label><label>Etapa de origem<select name="etapa">'+opts(ET)+'</select></label><label>Etapa de detecção<select name="detec">'+opts(ET.slice(1))+'</select></label><label>Subprocesso<input name="sub" list="dl_s"></label><label>Ponto de causa<input name="ponto" list="dl_p"></label>'+dls()+'<label class="w">Causa raiz (simples, objetiva e verificável)<textarea name="causa"></textarea></label><label>Grupo da causa raiz<select name="grupoCausa" onchange="sug4M(this)">'+opts(GC,"","Não definido")+'</select></label><label>Classificação 4M<select name="m4">'+opts(["Método","Mão de Obra","Máquina","Material"],"","Não definido")+'</select></label><label class="w">Evidência que sustenta a causa<textarea name="evid"></textarea></label><label class="w">Problema específico<input name="problemaEsp"></label><label class="w">5 Porquês (um por linha, só até onde houver evidência)<textarea name="porques"></textarea></label><label class="w">Controle preventivo ausente ou falho<input name="ctrlFalho"></label><label class="w">Ação estrutural recomendada<textarea name="acaoEst"></textarea></label><label>Indicador leading<input name="indLead"></label><label>Indicador lagging<input name="indLag"></label><label>Hora<input type="time" name="hora"></label><label>Severidade<select name="sev">'+opts(['Alta','Média','Baixa','Muito baixa'],'','Não informada')+'</select></label><label>Status da ocorrência<select name="stOc">'+opts(['Aberta','Em análise','Ação em andamento','Concluída'])+'</select></label><label>Tempo de resposta (min)<input type="number" min="0" name="tResp"></label><label>Tempo de resolução (min)<input type="number" min="0" name="tRes"></label><label>Refeições impactadas<input type="number" min="0" name="refImp"></label><label>Duração da ocorrência (min)<input type="number" min="0" name="dur"></label><label>Reclamações registradas<input type="number" min="0" name="recl"></label><label class="w">Lição aprendida<textarea name="licao"></textarea></label><label>Status de validação<select name="status">'+opts(["Em investigação","Validada"])+'</select></label><label>Responsável pelo registro<input name="resp"></label></div><p class="mut">Para marcar como Validada, informe a causa raiz e a evidência. Sem isso, a causa fica Em investigação.</p><button class="b" onclick="addA()">Salvar anomalia</button></form>'}
function addA(){var F=document.getElementById("fa"),v={};Array.prototype.forEach.call(F.elements,function(e){if(e.name)v[e.name]=e.value.trim()});
if(!v.data||!v.desc){note="!Informe a data e a descrição da ocorrência.";return draw()}
if(v.status==="Validada"&&(!v.causa||!v.evid)){note="!Para validar, preencha causa raiz e evidência.";return draw()}
var old0=edId?db.an.filter(function(x){return x.id===edId})[0]:null;if(edId)db.an=db.an.filter(function(x){return x.id!==edId});db.an.push(Object.assign({},old0||{},{id:edId||nid(),data:v.data,corr:corrOf(v.rest),site:siteOf(v.rest),rest:v.rest,unidade:v.unidade,turno:v.turno,tipo:v.tipo,produto:v.produto,desc:v.desc,grupoProb:v.grupoProb,etapa:v.etapa,detec:v.detec,sub:v.sub,ponto:v.ponto,causa:v.causa,grupoCausa:v.grupoCausa,m4:v.m4,evid:v.evid,status:v.status,resp:v.resp,hora:v.hora,sev:v.sev,stOc:v.stOc,tResp:v.tResp,tRes:v.tRes,refImp:v.refImp,licao:v.licao,problemaEsp:v.problemaEsp,porques:v.porques,ctrlFalho:v.ctrlFalho,acaoEst:v.acaoEst,indLead:v.indLead,indLag:v.indLag,dur:v.dur,recl:v.recl}));save();note=edId?"Alterações salvas em "+edId+".":"Anomalia salva. Ela já aparece na Visão Executiva.";edId="";draw()}
function base(){var o=db.op.slice().sort(function(a,b){return b.mes.localeCompare(a.mes)});
return'<h2>Base Histórica e Importação</h2>'+(note?'<div class="msg'+(note.charAt(0)==="!"?" err":"")+'">'+esc(note.replace(/^!/,""))+'</div>':'')+
'<div class="gr"><div class="c"><h3>Refeições servidas por mês</h3><div class="f"><label>Restaurante<select id="or">'+opts(db.rest.concat(["Total (todos)"]))+'</select></label><label>Mês<input type="month" id="om"></label><label>Refeições<input type="number" id="on" min="1"></label></div><p class="mut">Use “Total (todos)” quando só houver o volume geral. A taxa por restaurante exige o volume de cada um.</p><button class="b" onclick="addO()">Salvar refeições</button></div>'+
